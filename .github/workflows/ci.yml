name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer run for the same branch replaces any older one still queued or running.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # SK1Tokens imports Foundation only, so it builds and tests on Linux. SK1UI's SwiftUI files are wrapped in
  # `#if canImport(SwiftUI)`, so on Linux it builds with only its Foundation text logic, which SK1UITests covers.
  linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain version
        run: swift --version
      - name: Unit tests (warnings are errors)
        shell: bash
        run: swift test -Xswiftc -warnings-as-errors 2>&1 | tee "$RUNNER_TEMP/test-linux.log"
      - name: Compiler diagnostics
        if: always()
        shell: bash
        run: .github/scripts/report-diagnostics.sh "$RUNNER_TEMP/test-linux.log"

  apple:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Use the newest Xcode on the runner: newer compilers add warnings the default one doesn't report.
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          # Versioned bundles only: the plain Xcode.app is the runner's default, which sorts last.
          NEWEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
      # The gallery snapshot test writes its PNGs to SK1_SNAPSHOT_DIR.
      - name: Unit tests on macOS (warnings are errors)
        shell: bash
        env:
          SK1_SNAPSHOT_DIR: ${{ runner.temp }}/sk1-gallery
        run: swift test -Xswiftc -warnings-as-errors 2>&1 | tee "$RUNNER_TEMP/test-macos.log"
      - name: Upload gallery snapshots
        uses: actions/upload-artifact@v4
        with:
          name: sk1-gallery
          path: ${{ runner.temp }}/sk1-gallery
          if-no-files-found: error
      - name: Schemes
        run: xcodebuild -list
      # With more than one library product, the package's scheme that builds them all is SK1Kit-Package.
      - name: Compile for iOS (warnings are errors)
        shell: bash
        run: |
          SCHEME=$(xcodebuild -list -json | python3 -c 'import json, sys; s = json.load(sys.stdin)["workspace"]["schemes"]; print("SK1Kit-Package" if "SK1Kit-Package" in s else "SK1Kit")')
          echo "Scheme: $SCHEME"
          xcodebuild build -scheme "$SCHEME" -destination 'generic/platform=iOS' \
            OTHER_SWIFT_FLAGS='-warnings-as-errors' 2>&1 | tee "$RUNNER_TEMP/build-ios.log"
      - name: Compiler diagnostics
        if: always()
        shell: bash
        run: .github/scripts/report-diagnostics.sh "$RUNNER_TEMP/test-macos.log" "$RUNNER_TEMP/build-ios.log"
