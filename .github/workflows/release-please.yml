name: Release Please

# On every push to main, release-please reads the commit messages since the last release and keeps a release PR
# open: the next version (fix: -> patch, feat: -> minor, a "!" or BREAKING CHANGE -> major; while below 1.0 a
# breaking change bumps the minor instead), CHANGELOG.md and version.txt. Merging that PR tags vX.Y.Z and creates
# the GitHub release; apps pick the package up by that tag.
#
# Needs Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
